<style>
/* Layout: black page, dark oval table, nameplates centred on the rim with cards and bets pointing to the centre, four-colour cards, street timeline below. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --fg: #f4f4f4;
  --muted: #8d8d8d;
  --line: #2b2b2b;
  --btn: #2d2f36;
  --btn-hi: #3a3d46;
  --plate: #0b0d12;
  --felt-a: #0b3b20;
  --felt-b: #041b0e;
  --rail: #0b0b0b;
  --stack: #f2a22a;
  --hl: #ffffff;
  --win: #22b35e;
  --lose: #d8322f;
  --su-s: #1c1c1c;
  --su-h: #c21f1f;
  --su-d: #2160dc;
  --su-c: #1e9442;
  --back: #d83a5e;
  --font: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
h1 { font-weight: 700; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.78rem; overflow-wrap: anywhere; }
.hr { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.info { text-align: right; font-size: 0.75rem; line-height: 1.3; font-weight: 500; }
.info .itm { color: var(--win); }
.unit { display: inline-flex; background: var(--plate); border: 1px solid #20232b; border-radius: 9px; padding: 2px; }
.unit button { min-height: 32px; min-width: 0; padding: 4px 12px; font-size: .8rem; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
.unit button[aria-pressed="true"] { background: var(--btn); color: var(--fg); }

.table { position: relative; width: 100%; aspect-ratio: 1.45 / 1; margin-top: 60px; margin-bottom: 10px; container-type: inline-size; }
.seat { --x: var(--lx); --y: var(--ly); }
.felt {
  position: absolute; inset: 10% 3%; border-radius: 50%;
  background: radial-gradient(ellipse at center, var(--felt-a) 0%, var(--felt-b) 100%);
  border: 13px solid var(--rail); box-shadow: 0 0 0 2px var(--line), inset 0 0 0 2px #0a2515;
}
.felt::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); }
.center { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pots { font-size: .78rem; color: var(--fg); background: rgba(0,0,0,.35); padding: 2px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pot { font-weight: 500; font-size: 1rem; color: var(--stack); font-variant-numeric: tabular-nums; white-space: nowrap; }
.board { display: flex; gap: 6px; min-height: 3.6em; font-size: clamp(15px, 3.1cqw, 26px); }

.card {
  position: relative; width: 2.6em; height: 3.6em; border-radius: .28em; color: #fff; font-weight: 700;
  box-shadow: 0 1px 3px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18); flex: none;
}
.card .tl { position: absolute; top: .22em; left: .3em; font-size: .62em; line-height: 1; display: flex; flex-direction: column; align-items: center; }
.card .tl i { font-style: normal; font-size: .95em; }
.card .br { position: absolute; right: .22em; bottom: .12em; font-size: 1.45em; line-height: 1; }
.card.su-s { background: var(--su-s); border-color: #5a5a5a; }
.card.su-h { background: var(--su-h); }
.card.su-d { background: var(--su-d); }
.card.su-c { background: var(--su-c); }
.card.back { background: var(--back); border: 2px solid #f4a3b3; }
.card.empty { background: rgba(0,0,0,.18); box-shadow: none; border: 1px dashed rgba(255,255,255,.22); }

/* the seat box is the nameplate, centred on the rim; cards, hand name and bet stack toward the table centre */
.seat {
  position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
  width: clamp(98px, 15.5cqw, 134px); transition: opacity .25s;
}
.xtra { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; width: max-content; }
.xtra { bottom: calc(100% + 6px); flex-direction: column-reverse; }
.hole { display: flex; font-size: clamp(12px, 2.4cqw, 20px); }
.hole:empty { display: none; }
.hole .card + .card { margin-left: -.35em; transform: rotate(4deg); transform-origin: bottom left; }
.hn { font-size: 0.68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; background: var(--plate); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.bet { position: absolute; left: var(--bx); top: var(--by); transform: translate(-50%, -50%); z-index: 2; font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9); }
.plate {
  position: relative; width: 100%; background: var(--plate); border: 2px solid #20232b; border-radius: 10px;
  padding: 6px 6px 5px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.6);
}
.seat.hot .plate { border-color: var(--hl); box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 14px rgba(255,255,255,.35); }
.seat.folded { opacity: .4; }
.ko { position: absolute; right: -10px; top: -10px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb347, #e8761a); border: 2px solid #fff; color: #fff; font-size: .52rem; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.nm { font-size: 0.84rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stk { font-size: 0.98rem; font-weight: 700; color: var(--stack); font-variant-numeric: tabular-nums; white-space: nowrap; }
.seat.hero .nm { font-weight: 500; }
.pos { position: absolute; top: -12px; left: 6px; font-size: .78rem; font-weight: 700; line-height: 1.35; background: #e6e6e6; color: #111; padding: 1px 9px; border-radius: 999px; }
.btn-d { position: absolute; top: -15px; right: 2px; width: 30px; height: 30px; border-radius: 50%; background: #f0a21d; color: #3a2400; font-weight: 700; font-size: .95rem; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.7); border: 2px solid #ffd27a; }

/* equity bar on the outer side of the plate */
.eq { position: absolute; left: 0; right: 0; top: calc(100% + 4px); height: 18px; border-radius: 5px; background: #1a1c22; overflow: hidden; }
.eq .f { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .7s ease, background-color .4s; }
.eq.win .f { background: var(--win); }
.eq.lose .f { background: var(--lose); }
.eq .t { position: relative; display: block; text-align: center; font-size: .72rem; font-weight: 700; line-height: 18px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.8); }

.tl-wrap { position: relative; display: flex; justify-content: space-between; margin-top: 4px; }
.tl-wrap::before { content: ""; position: absolute; left: var(--tl-inset, 8%); right: var(--tl-inset, 8%); top: 12px; height: 3px; background: #2a2a2a; }
.tl-fill { position: absolute; left: var(--tl-inset, 8%); top: 12px; height: 3px; background: var(--stack); width: 0; transition: width .25s; }
.ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button {
  font: inherit; font-weight: 700; background: var(--btn); color: var(--fg); border: 0; border-bottom: 3px solid #1c1e24;
  border-radius: 10px; padding: 9px 18px; cursor: pointer; min-height: 44px; min-width: 96px;
}
button:hover:not(:disabled) { background: var(--btn-hi); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#prev, #next { min-width: 56px; font-size: 1.4rem; line-height: 1; padding: 6px 14px; }
.stp { position: relative; flex: 1; min-width: 0; background: none; border: 0; border-radius: 8px; min-height: 0; padding: 0 0 4px; text-align: center; color: var(--fg); font-weight: 500; }
.stp:hover:not(:disabled) { background: none; }
.stp .dot { display: block; width: 18px; height: 18px; border-radius: 50%; margin: 3px auto 0; border: 2px solid #4a4a4a; background: #000; position: relative; }
.stp .lb { display: block; margin-top: 10px; font-size: .9rem; }
.stp .pt { display: block; margin-top: 2px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.stp.done .dot { background: #cfcfcf; border-color: #cfcfcf; }
.stp.todo .lb { color: var(--muted); }
.stp.now .dot { width: 26px; height: 26px; margin-top: 0; background: var(--stack); border-color: var(--stack); box-shadow: 0 0 0 5px rgba(242,162,42,.25); }
.stp.now .lb { color: var(--stack); font-weight: 700; margin-top: 6px; }
.cnt { font-size: 0.8rem; color: var(--muted); min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 0.78rem; }

@media (max-width: 600px) {
  .table { aspect-ratio: 1 / 1.3; }
  .seat { --x: var(--nx); --y: var(--ny); width: 92px; }
  .felt { inset: 9% 2%; border-width: 10px; }
  .nm { font-size: 0.74rem; }
  .stk { font-size: 0.84rem; }
  .pos { font-size: .68rem; padding: 0 7px; }
  .btn-d { width: 26px; height: 26px; font-size: .82rem; }
  .hn { font-size: 0.6rem; padding: 1px 5px; }
  .bet { font-size: .82rem; left: var(--bnx); top: var(--bny); }
  .card .br { font-size: 1.35em; }
  .board { font-size: 13px; gap: 5px; }
  .hr { align-items: flex-start; }
  .info { text-align: left; }
  .stp .lb { font-size: .74rem; }
  .stp .pt { font-size: .66rem; }
}
@media (prefers-reduced-motion: reduce) { .seat, .eq .f, .tl-fill { transition: none; } }
</style>
